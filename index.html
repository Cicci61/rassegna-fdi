<style>
/* Layout: testata blu a tutta larghezza con tricolore, sommario fisso scorrevole, sezioni come fogli di rassegna con voci numerate ("comunicato sulla 7") */
:root {
  --bg: #eef1f6;
  --paper: #ffffff;
  --ink: #111c2e;
  --muted: #5a6880;
  --rule: #dde3ec;
  --accent: #1d4a96;
  --accent-soft: #e6edf8;
  --testata: #10264d;
  --testata-ink: #ffffff;
  --testata-muted: #b7c5de;
  --verde: #1f8a4c;
  --wa: #1c9a52;
  --rosso: #c4162a;
  --flag-mid: #ffffff;
  --display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", sans-serif;
  --body: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b111c; --paper: #131c2c; --ink: #e5ebf4; --muted: #94a3ba; --rule: #243149;
    --accent: #8db2f3; --accent-soft: #1b2843; --testata: #0f1f3d; --testata-ink: #f2f5fa; --testata-muted: #9fb0cf;
    --verde: #4cc485; --wa: #1c9a52; --rosso: #f0606f; --flag-mid: #e9edf2;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b111c; --paper: #131c2c; --ink: #e5ebf4; --muted: #94a3ba; --rule: #243149;
  --accent: #8db2f3; --accent-soft: #1b2843; --testata: #0f1f3d; --testata-ink: #f2f5fa; --testata-muted: #9fb0cf;
  --verde: #4cc485; --wa: #1c9a52; --rosso: #f0606f; --flag-mid: #e9edf2;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.55; padding-inline: 16px; padding-block: 0 56px; -webkit-text-size-adjust: 100%; }
.wrap { max-width: 760px; margin: 0 auto; }
a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 2px; }
a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

/* Testata */
.testata { background: var(--testata); color: var(--testata-ink); margin-inline: -16px; padding-inline: 16px; }
.testata-in { max-width: 760px; margin: 0 auto; padding-block: 26px 22px; }
.flag { display: grid; grid-template-columns: 1fr 1fr 1fr; height: 6px; margin-inline: -16px; }
.flag span:nth-child(1) { background: var(--verde); }
.flag span:nth-child(2) { background: var(--flag-mid); }
.flag span:nth-child(3) { background: var(--rosso); }
.eyebrow { font-family: var(--mono); font-size: 11.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--testata-muted); }
h1 { font-family: var(--display); font-weight: 800; font-size: clamp(40px, 11vw, 60px); line-height: .92; margin: 10px 0 12px; letter-spacing: .005em; text-transform: uppercase; text-wrap: balance; }
h1 span { display: block; color: var(--testata-muted); font-weight: 600; font-size: .55em; letter-spacing: .04em; margin-top: 4px; }
.edizione { font-family: var(--display); font-weight: 600; font-size: 22px; margin: 0; letter-spacing: .01em; }
.generato { font-family: var(--mono); font-size: 12px; color: var(--testata-muted); margin-top: 4px; font-variant-numeric: tabular-nums; }

/* Sommario fisso */
nav.sommario { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); margin-inline: -16px; padding: 10px 16px; border-bottom: 1px solid var(--rule); }
nav.sommario .chips { max-width: 760px; margin: 0 auto; display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
nav.sommario .chips::-webkit-scrollbar { display: none; }
nav.sommario a { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 7px; padding: 7px 13px; border: 1px solid var(--rule); border-radius: 999px; background: var(--paper); color: var(--ink); text-decoration: none; font-size: 14px; font-weight: 500; white-space: nowrap; }
nav.sommario a b { font-family: var(--mono); font-weight: 500; font-size: 11.5px; color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: 1px 7px; font-variant-numeric: tabular-nums; }
nav.sommario a.zero { color: var(--muted); }
nav.sommario a.zero b { color: var(--muted); background: transparent; }

/* Sezioni */
main { display: grid; gap: 22px; padding-top: 20px; }
section { scroll-margin-top: 70px; }
.sez-testa { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 4px; }
h2 { font-family: var(--display); font-weight: 700; font-size: 28px; line-height: 1.05; margin: 0; letter-spacing: .01em; text-transform: uppercase; text-wrap: balance; }
.conta { font-family: var(--mono); font-size: 12px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.sez-nota { color: var(--muted); font-size: 14px; margin: 0 0 12px; }
h3 { font-family: var(--display); font-weight: 600; font-size: 15px; text-transform: uppercase; letter-spacing: .08em; margin: 0; padding: 10px 16px 0; color: var(--accent); }
.foglio { background: var(--paper); border: 1px solid var(--rule); border-radius: 14px; overflow: hidden; }
.foglio + .foglio { margin-top: 10px; }

ol.voci { list-style: none; margin: 0; padding: 0; }
.voce { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 12px; padding: 14px 16px; border-top: 1px solid var(--rule); }
h3 + ol.voci .voce:first-child { border-top: 0; }
ol.voci > .voce:first-child { border-top: 0; }
.num { font-family: var(--mono); font-weight: 500; font-size: 13px; color: var(--accent); background: var(--accent-soft); border-radius: 8px; width: 34px; height: 30px; display: grid; place-items: center; font-variant-numeric: tabular-nums; }
.voce h4 { margin: 0; font-size: 16.5px; font-weight: 600; line-height: 1.35; text-wrap: pretty; }
.voce h4 a { color: var(--ink); text-decoration: none; display: block; }
.voce h4 a:hover { color: var(--accent); }
.meta { font-size: 12.5px; color: var(--muted); margin-top: 6px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.chi { font-weight: 600; color: var(--accent); }
.meta .quando { font-family: var(--mono); font-size: 11.5px; font-variant-numeric: tabular-nums; }
.sintesi { margin: 8px 0 0; font-size: 15px; color: var(--ink); }
.altre { margin: 8px 0 0; font-size: 13px; color: var(--muted); }
.altre a { color: var(--muted); }

/* In evidenza */
.evidenza .foglio { border-color: var(--accent); }
.evidenza .voce:first-child h4 { font-family: var(--display); font-weight: 700; font-size: 25px; line-height: 1.1; }
.evidenza .voce:first-child .num { background: var(--accent); color: var(--paper); }

/* Spunti */
.spunti ol { list-style: none; margin: 0; padding: 0; }
.spunto { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 12px; padding: 14px 16px; border-top: 1px solid var(--rule); }
.spunto:first-child { border-top: 0; }
.spunto p { margin: 0; font-size: 15px; }
.istruzione { font-size: 13.5px; color: var(--muted); margin: 10px 2px 0; }

/* WhatsApp */
.wa-box { padding: 16px; display: grid; gap: 12px; }
.wa-testo { white-space: pre-wrap; overflow-wrap: anywhere; font-family: var(--body); font-size: 15px; background: var(--bg); border-radius: 10px; padding: 12px 14px; margin: 0; }
.wa-azioni { display: flex; flex-wrap: wrap; gap: 8px; }
.wa-btn { font: 600 15px var(--body); padding: 11px 18px; border-radius: 999px; border: 1px solid var(--rule); background: var(--paper); color: var(--ink); cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; }

.vuoto { color: var(--muted); font-style: italic; padding: 14px 16px; margin: 0; }
footer { margin-top: 28px; padding-top: 16px; border-top: 1px solid var(--rule); font-size: 13.5px; color: var(--muted); display: grid; gap: 12px; }
footer h2 { font-size: 18px; color: var(--ink); }
footer ul { padding-left: 18px; margin: 0; }
footer p { margin: 0; }
details summary { cursor: pointer; color: var(--ink); font-weight: 500; padding-block: 6px; }
details .monitor { font-size: 13px; columns: 2 240px; column-gap: 24px; margin-top: 8px; }
details .monitor p { margin: 0 0 8px; break-inside: avoid; }
@media (prefers-reduced-motion: no-preference) { nav.sommario a, .voce h4 a, .wa-btn { transition: color .15s, border-color .15s, background-color .15s; } }

/* Telefono */
@media (max-width: 640px) {
  
  .foglio { margin-inline: -6px; }
}
</style>

const $ = (t, a = {}, ...figli) => {
  const e = document.createElement(t);
  for (const [k, v] of Object.entries(a)) { if (k === "class") e.className = v; else if (k === "html") e.innerHTML = v; else e.setAttribute(k, v); }
  for (const f of figli) if (f != null) e.append(f);
  return e;
};
const linkEsterno = (href, testo) => $("a", { href, target: "_blank", rel: "noopener" }, testo);
const sezTesta = (titolo, conta) => $("div", { class: "sez-testa" }, $("h2", {}, titolo), conta != null ? $("span", { class: "conta" }, conta) : null);
const notizie = n => n === 1 ? "1 notizia" : n + " notizie";

function voce(v) {
  const meta = $("div", { class: "meta" });
  if (v.chi) meta.append($("span", { class: "chi" }, v.chi));
  if (v.fonte) meta.append($("span", {}, v.fonte));
  if (v.data) meta.append($("span", { class: "quando" }, v.data));
  const corpo = $("div", { style: "min-width:0" }, $("h4", {}, linkEsterno(v.link, v.titolo)), meta);
  if (v.sintesi) corpo.append($("p", { class: "sintesi" }, v.sintesi));
  if (v.altre_fonti && v.altre_fonti.length) {
    const p = $("p", { class: "altre" }, "Anche su: ");
    v.altre_fonti.forEach((a, i) => { if (i) p.append(", "); p.append(linkEsterno(a.link, a.fonte)); });
    corpo.append(p);
  }
  return $("li", { class: "voce", id: "n" + v.n }, $("div", { class: "num" }, String(v.n)), corpo);
}
function elenco(voci) { const ol = $("ol", { class: "voci" }); voci.forEach(v => ol.append(voce(v))); return ol; }

const tutte = {};
(ED.sezioni || []).forEach(s => (s.gruppi || []).forEach(g => (g.voci || []).forEach(v => tutte[v.n] = v)));
const totale = Object.keys(tutte).length;

document.getElementById("edizione").textContent = ED.edizione || "";
document.getElementById("generato").textContent = [notizie(totale), ED.generato ? "aggiornata alle " + ED.generato.split(" ").pop() : ""].filter(Boolean).join(" · ");

const main = document.getElementById("contenuto");
const nav = document.getElementById("sommario");

if (ED.evidenza && ED.evidenza.length) {
  nav.append($("a", { href: "#evidenza" }, "In evidenza"));
  main.append($("section", { id: "evidenza", class: "evidenza" }, sezTesta("In evidenza"),
    $("div", { class: "foglio" }, elenco(ED.evidenza.map(n => tutte[n]).filter(Boolean)))));
}
(ED.sezioni || []).forEach(s => {
  const n = (s.gruppi || []).reduce((t, g) => t + (g.voci || []).length, 0);
  nav.append($("a", { href: "#" + s.id, class: n ? "" : "zero" }, s.titolo, $("b", {}, String(n))));
  const sez = $("section", { id: s.id }, sezTesta(s.titolo, n ? notizie(n) : null));
  if (s.nota) sez.append($("p", { class: "sez-nota" }, s.nota));
  if (!n) sez.append($("div", { class: "foglio" }, $("p", { class: "vuoto" }, s.vuoto || "Nessuna notizia nuova nelle ultime 24 ore.")));
  (s.gruppi || []).forEach(g => {
    if (!(g.voci || []).length) return;
    sez.append($("div", { class: "foglio" }, g.titolo ? $("h3", {}, g.titolo) : null, elenco(g.voci)));
  });
  main.append(sez);
});
if (ED.spunti && ED.spunti.length) {
  nav.append($("a", { href: "#spunti" }, "Spunti", $("b", {}, String(ED.spunti.length))));
  const ol = $("ol");
  ED.spunti.forEach(s => ol.append($("li", { class: "spunto" }, $("div", { class: "num" }, String(s.n)), $("p", {}, s.testo))));
  main.append($("section", { id: "spunti", class: "spunti" },
    sezTesta("Spunti per il circolo"),
    $("p", { class: "sez-nota" }, "Notizie da cui può nascere un comunicato, un post o una presa di posizione locale."),
    $("div", { class: "foglio" }, ol),
    $("p", { class: "istruzione" }, "Scrivi a Claude “comunicato sulla N” o “post sulla N”: riapre la fonte e prepara la bozza.")));
}
if (ED.whatsapp) {
  nav.append($("a", { href: "#whatsapp" }, "Messaggio"));
  const testo = $("pre", { class: "wa-testo" }, ED.whatsapp);
  const copia = $("button", { type: "button", class: "wa-btn", id: "wa-copia" }, "Copia testo");
  copia.addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(ED.whatsapp); copia.textContent = "Copiato ✓"; }
    catch (e) { const r = document.createRange(); r.selectNodeContents(testo); const s = getSelection(); s.removeAllRanges(); s.addRange(r); copia.textContent = "Testo selezionato, ora copialo"; }
  });
  main.append($("section", { id: "whatsapp" },
    sezTesta("Messaggio da girare"),
    $("p", { class: "sez-nota" }, "Messaggio pronto con il link fisso della rassegna: chi lo apre vede sempre l'ultima edizione."),
    $("div", { class: "foglio" }, $("div", { class: "wa-box" }, testo, $("div", { class: "wa-azioni" }, copia)))));
}

const piede = document.getElementById("piede");
if (ED.fonti_saltate && ED.fonti_saltate.length) {
  const ul = $("ul"); ED.fonti_saltate.forEach(f => ul.append($("li", {}, f)));
  piede.append($("h2", {}, "Fonti non raggiungibili oggi"), ul);
}
if (ED.monitorati) {
  const box = $("div", { class: "monitor" });
  ED.monitorati.forEach(m => box.append($("p", {}, $("strong", {}, m.gruppo + ": "), m.nomi)));
  piede.append($("details", {}, $("summary", {}, "Chi seguiamo e da quali fonti"), box));
}
if (ED.nota) piede.append($("p", {}, ED.nota));

(() => {

  let chiuso = false; try { chiuso = localStorage.getItem("installa-chiuso") === "1"; } catch (e) {}

  const ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  if (ios) { p.innerHTML = "<strong>Installa l'app:</strong> tocca Condividi <span aria-hidden=\"true\">(il quadrato con la freccia)</span> e poi «Aggiungi alla schermata Home»."; mostra(); return; }
  addEventListener("beforeinstallprompt", ev => {
    ev.preventDefault();
    p.innerHTML = "<strong>Installa l'app</strong> per aprire la rassegna con un tocco.";
    const si = document.createElement("button"); si.type = "button"; si.className = "si"; si.textContent = "Installa";
    si.onclick = async () => { ev.prompt(); await ev.userChoice; box.remove(); };
    p.after(si); mostra(); box.insertBefore(si, no);
  });
})();
